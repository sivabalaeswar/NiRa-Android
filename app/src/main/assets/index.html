<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NiRa 3D Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #canvas-wrap {
      width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at top, #132238 0%, #070b14 75%);
      font-family: system-ui, -apple-system, sans-serif; color: #e8eef8;
    }
    #hud {
      position: fixed; top: 46px; left: 14px; right: 14px; z-index: 10;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      pointer-events: none;
    }
    .pill {
      pointer-events: auto;
      background: rgba(12, 20, 36, 0.72); border: 1px solid rgba(125, 211, 252, 0.25);
      backdrop-filter: blur(10px); padding: 8px 12px; border-radius: 999px;
      font-size: 12px; display: flex; align-items: center; gap: 6px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f87171; }
    .dot.ok { background: #34d399; }
    #status-msg {
      position: fixed; bottom: 106px; left: 14px; right: 14px; z-index: 10;
      background: rgba(10, 17, 30, 0.78); border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px; padding: 10px 14px; font-size: 13px; line-height: 1.4;
      max-height: 110px; overflow-y: auto;
    }
    #controls {
      position: fixed; bottom: 34px; left: 14px; right: 14px; z-index: 10;
      display: flex; gap: 8px;
    }
    #msg-input {
      flex: 1; padding: 12px 14px; border-radius: 14px;
      border: 1px solid rgba(125, 211, 252, 0.3);
      background: rgba(12, 20, 36, 0.88); color: #fff; font-size: 14px; outline: none;
    }
    button {
      padding: 12px 15px; border-radius: 14px; border: none;
      background: #0ea5e9; color: #04101c; font-weight: 700; font-size: 13px;
    }
    button.mic { background: #10b981; color: #041811; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div id="hud">
    <div class="pill">
      <span id="engine-dot" class="dot"></span>
      <span id="engine-label">NiRa 3D • Checking 8765...</span>
    </div>
    <div class="pill" id="device-label">Motorola Edge 60 Pro</div>
  </div>

  <div id="status-msg">Freya.glb 3D அவதார் லோட் ஆகிக்கிட்டு இருக்கு...</div>

  <div id="controls">
    <input id="msg-input" type="text" placeholder="NiRa கிட்ட கேளு..." />
    <button class="mic" id="mic-btn">🎤</button>
    <button id="send-btn">Send</button>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const statusEl = document.getElementById("status-msg");
    const dotEl = document.getElementById("engine-dot");
    const engineLabelEl = document.getElementById("engine-label");
    const deviceLabelEl = document.getElementById("device-label");
    const inputEl = document.getElementById("msg-input");

    if (window.NiRaBridge && window.NiRaBridge.getDeviceInfo) {
      deviceLabelEl.textContent = window.NiRaBridge.getDeviceInfo();
    }

    function speak(text) {
      if (window.NiRaBridge && window.NiRaBridge.speak) {
        window.NiRaBridge.speak(text);
      }
    }

    window.onNativeSpeechResult = function(spokenText) {
      inputEl.value = spokenText;
      sendMessage(spokenText);
    };

    const container = document.getElementById("canvas-wrap");
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(0, 1.35, 2.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.15, 0);
    controls.enableDamping = true;
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.3));
    const keyLight = new THREE.DirectionalLight(0xfff4e0, 2.2);
    keyLight.position.set(2, 4, 3);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    rimLight.position.set(-2, 2, -2);
    scene.add(rimLight);

    let mixer = null;
    let avatarRoot = null;

    const loader = new GLTFLoader();
    loader.load(
      "Freya.glb",
      (gltf) => {
        avatarRoot = gltf.scene;
        const box = new THREE.Box3().setFromObject(avatarRoot);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const scale = 1.7 / maxDim;
        avatarRoot.scale.setScalar(scale);
        avatarRoot.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);
        scene.add(avatarRoot);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(avatarRoot);
          mixer.clipAction(gltf.animations[0]).play();
        }
        const greeting = "வணக்கம்! Freya 3D அவதார் தயாரா இருக்கேன்.";
        statusEl.textContent = greeting;
        speak(greeting);
      },
      (xhr) => {
        if (xhr.total) {
          const pct = Math.round((xhr.loaded / xhr.total) * 100);
          statusEl.textContent = "Freya.glb லோட் ஆகுது: " + pct + "%";
        }
      },
      (err) => {
        statusEl.textContent = "Freya.glb லோட் ஆகல: " + err.message;
      }
    );

    async function checkEngine() {
      try {
        const res = await fetch("http://127.0.0.1:8765/health", { signal: AbortSignal.timeout(1500) });
        if (res.ok) {
          dotEl.classList.add("ok");
          engineLabelEl.textContent = "NiRa Core Online (8765)";
          return;
        }
      } catch (_) {}
      dotEl.classList.remove("ok");
      engineLabelEl.textContent = "Termux Core Offline (8765)";
    }
    checkEngine();
    setInterval(checkEngine, 5000);

    async function sendMessage(text) {
      const prompt = (text || inputEl.value || "").trim();
      if (!prompt) return;
      inputEl.value = "";
      statusEl.textContent = "You: " + prompt;

      try {
        const res = await fetch("http://127.0.0.1:8765/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: prompt })
        });
        const data = await res.json();
        const reply = data.reply || JSON.stringify(data);
        statusEl.textContent = "NiRa: " + reply;
        speak(reply);
      } catch (_) {
        const offlineMsg = "Termux-ல 8765 engine ஆஃப்லைன்ல இருக்கு, ஆனா 3D அவதார் & குரல் தயாரா இருக்கு!";
        statusEl.textContent = offlineMsg;
        speak(offlineMsg);
      }
    }

    document.getElementById("send-btn").addEventListener("click", () => sendMessage());
    inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
    document.getElementById("mic-btn").addEventListener("click", () => {
      if (window.NiRaBridge && window.NiRaBridge.startVoiceInput) {
        window.NiRaBridge.startVoiceInput();
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      if (avatarRoot) {
        avatarRoot.position.y += Math.sin(clock.elapsedTime * 2) * 0.0004;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
